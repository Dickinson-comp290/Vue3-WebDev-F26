<!doctype html>
<html lang="en">
  <head>
    <title>FlashWord</title>
    <meta charset="utf-8" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js" defer></script>
    <script src="app.js" defer></script>

    <style>
      label {
        display: block;
      }

      input,
      button {
        display: block;
        margin: 10px 0px;
      }

      .correct {
        color: green;
      }

      .incorrect {
        color: red;
      }

      [v-cloak] {
        display: none;
      }
    </style>
  </head>

  <body>
    <h1>FlashWord</h1>
    <p>
      This is a simple flashcard app that will test your knowledge of English
      words. You will be given a word in another language and you will need to
      type in the English translation of that word.
    </p>

    <div id="app" v-cloak>
      What is the English translation of the word
      <strong>{{ getRandomWord() }}</strong>?

      <label for="answer">Your Answer:</label>
      <input
        type="text"
        id="answer"
        v-model="answer"
        placeholder="Type your answer here..."
      />

      <p v-if='answer != ""'>Your answer: {{ wordA }}</p>

      <button v-on:click="checkAnswer()">Check Answer</button>

      <div v-show="showFeedback">
        <template v-if="showFeedback">
          <p v-if="correct">You got it!</p>
          <p v-else>Sorry, that is incorrect - try again.</p>
        </template>
      </div>

      <button v-on:click="reset()">Reset</button>
    </div>
  </body>
</html>
