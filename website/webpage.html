<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>dice roller</title>
    <link href="styles/style.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manufacturing+Consent&display=swap"
      rel="stylesheet"
    />
    <script async src="scripts/main.js"></script>
  </head>
  <body>
    <h1>dice roller</h1>
    <p>
      uses the <a href="https://dnd5e.wikidot.com/">dnd5e</a> standard dice set.
    </p>

    <ul>
      <li>click one of the dice to roll it</li>
      <li>view your result at the bottom</li>
    </ul>

    <table>
      <tr>
        <td><img src="images/d4.png" alt="d4" /></td>
        <td><img src="images/d6.png" alt="d6" /></td>
        <td><img src="images/d8.png" alt="d8" /></td>
        <td><img src="images/d10.png" alt="d10" /></td>
        <td><img src="images/d12.png" alt="d12" /></td>
        <td><img src="images/d20.png" alt="d20" /></td>
      </tr>
      <tr>
        <td>d4</td>
        <td>d6</td>
        <td>d8</td>
        <td>d10</td>
        <td>d12</td>
        <td>d20</td>
      </tr>
    </table>

    <p>you rolled...</p>
    <h1>0</h1>
  </body>
</html>
