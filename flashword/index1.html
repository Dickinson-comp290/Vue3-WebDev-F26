<!doctype html>
<html lang="en">
  <head>
    <title>FlashWord</title>
    <meta charset="utf-8" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script src="app.js" defer></script>

    <style>
      label {
        display: block;
      }

      input,
      button {
        display: block;
        margin: 10px 0px;
      }

      .correct {
        color: green;
      }

      .incorrect {
        color: red;
      }
    </style>
  </head>

  <body>
    <h1>FlashWord</h1>

    <div id="app">
      What is the English translation of the word <strong>{{ wordA }}</strong>?

      <input type="text" v-model="answer" />

      <p v-if="answer != ''">you answered: {{ answer }}</p>

      <button v-on:click="checkAnswer">Check Answer</button>

      <div v-if="showFeedback">
        <p v-if="correct" class="correct">you got it!</p>
        <p v-else-if="correct!=null" class="incorrect">Sorry try again</p>
      </div>
    </div>
  </body>
</html>
