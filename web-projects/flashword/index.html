<!doctype html>
<html lang="en">
  <head>
    <title>FlashWord</title>
    <meta charset="utf-8" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js" defer></script>
    <script src="app.js" defer></script>

    <style>
      label {
        display: block;
      }

      input,
      button {
        display: block;
        margin: 10px 0px;
      }

      .correct {
        color: green;
      }

      .incorrect {
        color: red;
      }

      .input-error {
        background-color: lightpink;
      }

      .input-normal {
        background-color: white;
      }

      .error {
        color: lightpink;
      }

      .achievement-badge {
        width: 200px;
        margin: 18px 0;
      }

      .achievement-badge img {
        display: block;
        width: 100%;
        height: auto;
      }

      [v-cloak] {
        display: none;
      }
    </style>
  </head>

  <body>
    <h1>FlashWord</h1>

    <p>
      This is a simple flashcard app that will show you a word in Spanish and
      ask you to enter the translation in English.
    </p>

    <div id="app" v-cloak>
      What is the English translation of the word <strong>{{ wordA }}</strong>?

      <label for="translation-input">Translation:</label>
      <input
        type="text"
        id="translation-input"
        v-model="answer"
        placeholder="Enter translation"
        v-bind:class="inputClass"
        v-bind:disabled="showFeedback"
      />

      <p v-show="answer != ''">You answered: {{ answer }}</p>

      <button v-on:click="checkAnswer()" v-bind:disabled="showFeedback">
        Check answer
      </button>

      <p v-show="showFeedback && correct" class="correct">You got it!</p>
      <p v-show="showFeedback && !correct" class="incorrect">
        Sorry, please try again.
      </p>

      <div
        v-if="hasEarnedBadge"
        class="achievement-badge"
        role="img"
        aria-label="80% correct achievement badge"
      >
        <img src="images/80%20percent.png" alt="" />
      </div>

      <button v-show="this.answer !=''" v-on:click="reset()">Reset</button>
    </div>
  </body>
</html>
