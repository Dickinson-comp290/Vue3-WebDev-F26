<!doctype html>
<html lang="en">
  <head>
    <title>FlashWord</title>
    <meta charset="utf-8" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js" defer></script>
    <script src="app.js" defer></script>

    <style>
      label {
        display: block;
      }

      input,
      button {
        display: block;
        margin: 10px 0px;
      }

      .correct {
        color: green;
      }

      .incorrect {
        color: red;
      }

      [v-cloak] {
        display: none;
      }
    </style>
  </head>

  <body>
    <h1>FlashWord</h1>

    <div id="app" v-cloak>
      <label for="answer">What is the English translation of <strong>{{ wordA }}</strong>?</label>

      <input type="text" id="answer" v-model="answer" />

      <p v-if="answer != ''">Your answer: {{ answer }}</p>
      <button v-on:click="checkAnswer()">Check Answer</button>
      <div v-if="showFeedback">
        <p v-if="correct" class="correct">You got it!</p>
        <p v-else class="incorrect">Nope that's wrong. Please try again.</p>
        <button v-on:click="reset()">Reset</button>
      </div>
    </div>
  </body>
</html>
