<!doctype html>
<html lang="en">
  <head>
    <title>FlashWord</title>
    <meta charset="utf-8" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js" defer></script>
    <script src="app.js" defer></script>

    <style>
      label {
        display: block;
      }

      input,
      button {
        display: block;
        margin: 10px 0px;
      }

      .correct {
        color: green;
      }

      .incorrect {
        color: red;
      }

      [v-cloak] {
        display: none;
      }
    </style>
  </head>

  <body>
    <h1>FlashWord</h1>

    <div id="app" v-cloak>
      What is the English translation of the word <strong>{{ wordA }}</strong>?
      <input type="text" v-model="answer" />
      <p v-if="answer != ''">You answered: {{answer}}</p>

      <button v-on:click="checkAnswer">Check Answer</button>

      <template v-if="showFeedback">
        <p v-if="correct" class="correct">You got it!</p>
        <p v-else-if class="incorrect">Sorry, try again :(</p>

        <button v-if="correct" v-on:click="resetAnswer">Reset Answer</button>
      </template>

      <p v-if='answer != ""'>Example A</p>
      <p v-show='answer != ""'>Example B</p>
    </div>
  </body>
</html>
