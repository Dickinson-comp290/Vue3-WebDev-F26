<!doctype html>
<html lang="en">
  <head>
    <title>FlashWord</title>
    <meta charset="utf-8" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js" defer></script>
    <script src="app.js" defer></script>
    <link href="styles.css" rel="stylesheet" />
  </head>

  <body>
    <div id="app" v-cloak>
      <h1>FlashWord</h1>

      <div id="cards">
        <div class="card" v-for="word in shuffleWords">{{ word.word_a }}</div>

        <input
          v-if="!word.correct"
          type="text"
          v-model="word.answer"
          v-on:keyup.enter="checkAnswer(word)"
        />
        <p v-else>{{ word.word_b }}</p>
      </div>
    </div>
  </body>
</html>
