<!doctype html>
<html lang="en">
  <head>
    <title>FlashWord</title>
    <meta charset="utf-8" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js" defer></script>
    <script src="app.js" defer></script>

    <style>
      label {
        display: block;
      }

      input,
      button {
        display: block;
        margin: 10px 0px;
      }

      .correct {
        color: rgb(79, 215, 79);
      }

      .incorrect {
        color: red;
      }

      [v-cloak] {
        display: none;
      }
      .error {
        background-color: rgb(255, 135, 169);
      }
    </style>
  </head>

  <body>
    <h1>FlashWord</h1>

    <p>
      This is a simple flashcard app that will show you a word in Spanish and
      ask you to enter the translation in English.
    </p>

    <div id="app" v-cloak>
      What is the English translation of the word <strong>{{ wordA }}</strong>?

      <label for="translation-input">Translation:</label>
      <p v-if="hasError">You must enter an answer</p>
      <input
        type="text"
        id="translation-input"
        v-model="answer"
        placeholder="Enter translation"
        v-on:keyup.enter="checkAnswer()"
        v-bind:class="{ error : hasError }"
      />

      <p v-show="answer != ''">You answered: {{ answer }}</p>
      <p v-if="answer != ''" v-on:input="hasError = false">
        <button v-on:click="reset()">Reset</button>
      </p>

      <img
        v-if="correctAnswers >= badgeThreshold"
        src="images/badge.png"
        alt="Correct answer badge"
      />

      <button v-on:click="checkAnswer()">Check answer</button>

      <p v-show="showFeedback && correct" class="correct">You got it!</p>
      <p v-show="showFeedback && !correct" class="incorrect">
        Sorry, please try again.
      </p>
    </div>
  </body>
</html>
