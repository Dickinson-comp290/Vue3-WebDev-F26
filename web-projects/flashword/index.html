<!doctype html>
<html lang="en">
  <head>
    <title>FlashWord</title>
    <meta charset="utf-8" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js" defer></script>
    <script src="app.js" defer></script>

    <style>
      label {
        display: block;
      }

      input,
      button {
        display: block;
        margin: 10px 0px;
      }

      .correct {
        color: green;
      }

      .incorrect {
        color: red;
      }

      [v-cloak] {
        display: none;
      }
    </style>
  </head>

  <body>
    <h1>FlashWord</h1>

    <div id="app" v-cloak>
      <label for="answer"
        >What is the English translation of <strong>hola</strong>?</label
      >

      <input type="text" id="answer" v-model="answer" />

      <button v-on:click="checkAnswer()">Check Answer</button>

      <p v-show='answer != ""'>Your answer: {{ answer }}</p>

      <div v-show="showFeedback">
        <p v-show="correct" class="correct">You got it!</p>
        <p v-show="!correct" class="incorrect">Try again</p>
      </div>
      <button v-on:click="reset()">Reset</button>
    </div>
  </body>
</html>
