<!doctype html>
<html lang="en">
  <head>
    <title>FlashWord</title>
    <meta charset="utf-8" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="app.js" defer></script>

    <style>
      label {
        display: block;
      }

      input,
      button {
        display: block;
        margin: 10px 0px;
      }

      .correct {
        color: green;
      }

      .incorrect {
        color: red;
      }

      [v-cloak] {
        display: none;
      }
    </style>
  </head>

  <body>
    <h1>FlashWord</h1>
    <h2>Introduction:</h2>
    <p>
      Welcome to FlashWord! This is a simple flashcard app to help you learn new
      words.
    </p>
    <div id="app" v-cloak>
      What is the english translation of the word
      <strong>{{ wordA }}</strong>?

      <input
        type="text"
        placeholder="Enter your answer..."
        label="Your answer:"
        v-model="answer"
      />

      <p v-show="answer != ''">You answered: {{ answer }}</p>

      <button v-on:click="checkAnswer()">Check answer</button>

      <div v-show="showFeedback">
        <p v-show="correct" class="correct">You got it!</p>
        <p v-show="incorrect" class="incorrect">Please Try Again</p>
      </div>
      <button v-on:click="reset()">Reset</button>
    </div>
  </body>
</html>
